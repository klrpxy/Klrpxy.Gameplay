name: dotnet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Klrpxy.Gameplay.sln

      - name: Build
        run: dotnet build Klrpxy.Gameplay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Klrpxy.Gameplay.sln --configuration Release --no-restore --no-build
